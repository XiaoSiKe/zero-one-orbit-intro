<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>零一·环轨启序｜零一 AI 日新社</title>
  <link rel="preload" as="image" href="/dsh-startup/asset/rixin-logo.jpg">
  <link rel="stylesheet" href="../lib/splash.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #f2f2f2; }
    body { font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .rixin-backdrop { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 52px 24px 90px; text-align: center; }
    .rixin-mark { width: 150px; height: 160px; position: relative; overflow: hidden; margin-bottom: 32px; }
    .rixin-mark img { width: 350px; height: 350px; max-width: none; position: absolute; left: -100px; top: -103px; }
    h1 { margin: 0; font-size: clamp(25px, 3.8vw, 40px); font-weight: 500; letter-spacing: .12em; }
    .rixin-motto { margin: 24px 0 0; font-size: clamp(13px, 1.7vw, 19px); font-weight: 400; line-height: 1.9; letter-spacing: .06em; color: #bfbfbf; text-wrap: balance; }
    #rixin-replay { position: fixed; bottom: 30px; left: 32px; min-width: 154px; min-height: 52px; padding: 15px 24px; border: 1px solid #777; background: #000; color: #e5e5e5; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    #rixin-replay[hidden] { display: none; }
    #rixin-replay:focus-visible { outline: 2px solid white; outline-offset: 5px; }
    @media (hover: hover) { #rixin-replay:hover { border-color: #ddd; } }
    @media (max-width: 600px) { .rixin-motto { max-width: 24em; } #rixin-replay { left: 24px; bottom: 24px; } }
  </style>
</head>
<body>
  <main class="rixin-backdrop">
    <div class="rixin-mark"><img src="/dsh-startup/asset/rixin-logo.jpg" alt="零一 AI 日新社 Logo"></div>
    <h1>零一 AI 日新社</h1>
    <p class="rixin-motto">从零到一，让技术进步成为每个人的机会！</p>
  </main>
  <button id="rixin-replay" type="button" hidden>重新播放 ↺</button>
  <div id="dsh-startup-root" class="dsu-root dsu-boot"></div>
  <script>
    window.__DSH_STARTUP_SCRIPT_URL__ = '../lib/splash.js';
    window.__DSH_STARTUP__ = {
      enabled: true,
      mode: 'always',
      requireInteraction: true,
      speed: 1,
      sound: true,
      voice: true
    };
    document.documentElement.classList.add('dsu-lock');
    var replay = document.getElementById('rixin-replay');
    window.addEventListener('dsh-startup:done', function () { replay.hidden = false; });
    replay.addEventListener('click', function () {
      var api = window.__DSH_STARTUP_API__;
      if (api && typeof api.replay === 'function') {
        replay.hidden = true;
        api.replay();
      }
    });
  </script>
  <script defer src="../lib/splash.js"></script>
</body>
</html>
